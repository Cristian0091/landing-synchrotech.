<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Ticket Support | Reporte de incidencias</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <div class="ticket-card">
    <div class="card-header">
      <h1><i class="fas fa-ticket-alt"></i> TECNI TICKET</h1>
      <p>Registra tu incidencia, adjunta una imagen (opcional) y envía la solicitud directamente al soporte vía WhatsApp</p>
    </div>
    <div class="form-body">
      <div id="alertBox" class="alert-message">
        <i class="fas fa-info-circle"></i> Completa todos los campos obligatorios.
      </div>

      <form id="ticketForm">
        <div class="input-group">
          <label><i class="fas fa-building"></i> Área / Departamento *</label>
          <select id="area" required>
            <option value="" disabled selected>-- Selecciona tu área --</option>
            <option value="REGISTROS PUBLICOS">REGISTROS PUBLICOS</option>
            <option value="PROMOCION Y DESARROLLO">PROMOCION Y DESARROLLO</option>
            <option value="CONCILIACION Y ARBITRAJE">CONCILIACION Y ARBITRAJE</option>
            <option value="PRESIDENCIA">PRESIDENCIA</option>
            <option value="APOYO">APOYO</option>
            <option value="Otros">Otros</option>
          </select>
        </div>

        <div class="input-group">
          <label><i class="fas fa-user"></i> Nombre completo *</label>
          <input type="text" id="nombre" placeholder="Ej: Carlos Méndez" required autocomplete="name">
        </div>

        <div class="input-group">
          <label><i class="fas fa-desktop"></i> Problema con el equipo / TIPO DE IQUIPO *</label>
          <textarea id="problema" placeholder="Describe detalladamente el fallo, comportamiento inesperado, mensajes de error, etc." required></textarea>
        </div>

        <div class="image-zone">
          <label class="file-label" for="file-input">
            <i class="fas fa-camera"></i> Adjuntar imagen del problema
            <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
          </label>
          <input type="file" id="file-input" accept="image/jpeg, image/png, image/jpg, image/webp">
          <div class="info-size"><i class="fas fa-image"></i> Formatos: JPG, PNG, WEBP. Máx. 5 MB</div>
          <div id="previewWrapper" class="preview-container"></div>
        </div>

        <button type="button" id="sendTicketBtn" class="submit-btn">
          <i class="fab fa-whatsapp"></i> Enviar ticket a WhatsApp
        </button>
      </form>
    </div>
  </div>
  <footer><i class="fas fa-lock"></i> HERRAMIENTA DISEÑADA PARA REPORTAR INCIDENCIAS TÉCNICAS DERECHOS RESERVADOS © ZYNCHROTECH</footer>
</div>

<script src="script.js"></script>
</body>
</html>
