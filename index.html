<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi novia?</title>
    <link href=" https://cristian0091.github.io/landing-synchrotech./2.html " rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
            overflow: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: clamp(28px, 8vw, 48px);
            color: #fff;
            margin-bottom: 50px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
            font-weight: 700;
            line-height: 1.3;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            position: relative;
            min-height: 200px;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 600;
            padding: 18px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            color: #fff;
        }

        #btnSi {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            z-index: 1;
        }

        #btnSi:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        #btnSi:active {
            transform: translateY(-1px);
        }

        #btnNo {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            position: absolute;
            z-index: 1;
        }

        #btnNo:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(245, 87, 108, 0.4);
        }

        @media (max-width: 480px) {
            button {
                font-size: 18px;
                padding: 15px 40px;
            }

            h1 {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¿Quieres ser mi novia?</h1>
        <div class="buttons-container">
            <button id="btnSi">Sí</button>
            <button id="btnNo">No</button>
        </div>
    </div>

    <script>
        const btnSi = document.getElementById('btnSi');
        const btnNo = document.getElementById('btnNo');
        let clickCount = 0;

        btnSi.addEventListener('click', function() {
            window.location.href = 'https://ejemplo.com/si';
        });

        btnNo.addEventListener('click', function(e) {
            e.preventDefault();
            clickCount++;

            if (clickCount >= 3) {
                btnNo.textContent = '¿Por qué no dices que sí?';
            }

            moveButton();
        });

        function moveButton() {
            const container = document.querySelector('.buttons-container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            const maxX = containerRect.width - btnRect.width;
            const maxY = containerRect.height - btnRect.height;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Posicionar el botón "No" inicialmente
        window.addEventListener('load', function() {
            const container = document.querySelector('.buttons-container');
            const btnRect = btnNo.getBoundingClientRect();
            
            btnNo.style.left = (container.offsetWidth / 2 - btnRect.width / 2) + 'px';
            btnNo.style.top = '80px';
        });
    </script>
</html>
</body>
