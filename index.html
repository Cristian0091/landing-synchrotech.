<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏨 Hotel Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3 py-2">
  <span class="navbar-brand mb-0"><i class="bi bi-house-door-fill"></i> Hotel Admin</span>
  <div class="d-flex align-items-center gap-2 text-white">
    <select id="rol-select" class="form-select form-select-sm" style="width:auto">
      <option value="admin">👑 Admin</option>
      <option value="recepcionista" selected>🛎️ Recepción</option>
    </select>
    <button class="btn btn-sm btn-outline-light" onclick="resetDatos()" title="Borrar todo">🔄</button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<!-- MODAL GENÉRICO -->
<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
