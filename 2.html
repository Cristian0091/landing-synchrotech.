<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Un desafío romántico con cuenta regresiva hasta el 31 de octubre">
    <meta name="author" content="Tu Nombre">
    <title>El Desafío - Cuenta Regresiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 50%, #4a1942 100%);
            overflow: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: clamp(24px, 5vw, 48px);
            color: #ffffff;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 50px;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            animation: fadeIn 1.2s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeIn 1.5s ease-out 0.6s both;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            min-width: 100px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
        }

        .countdown-number {
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 800;
            color: #ff6b9d;
            display: block;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
        }

        .countdown-label {
            font-size: clamp(12px, 2vw, 16px);
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .footer-text {
            font-size: clamp(16px, 3vw, 22px);
            color: #ffffff;
            font-style: italic;
            opacity: 0.9;
            animation: fadeIn 1.8s ease-out 0.9s both;
        }

        .emoji {
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 768px) {
            h1 {
                margin-bottom: 40px;
            }

            .countdown {
                gap: 15px;
            }

            .countdown-item {
                min-width: 80px;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .countdown-item {
                min-width: 70px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            Buen intento, pero no te la voy a poner fácil.<br>
            Tienes hasta el 31 para ser tú la que me pidas ser tu novio.<br>
            Suerte 😏
        </h1>

        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Días</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Horas</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutos</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Segundos</span>
            </div>
        </div>

        <p class="footer-text">El tiempo corre… <span class="emoji">⏳</span></p>
    </div>

    <script>
        // Fecha objetivo: 31 de octubre de 2025 a las 12:00 PM
        const targetDate = new Date('2025-10-31T12:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Actualizar el contador inmediatamente
        updateCountdown();

        // Actualizar cada segundo
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
