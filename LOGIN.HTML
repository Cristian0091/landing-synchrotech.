<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 800px;
            height: 500px;
            perspective: 1200px;
        }

        .card-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-wrapper.register-mode {
            transform: rotateY(180deg);
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            backface-visibility: hidden;
            box-shadow: 
                0 0 40px rgba(0, 255, 255, 0.15),
                0 0 80px rgba(0, 255, 255, 0.05),
                inset 0 0 60px rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .card-front {
            background: linear-gradient(135deg, #0c1929 0%, #0a0e17 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #0c1929 0%, #0a0e17 100%);
            transform: rotateY(180deg);
        }

        /* Diagonal split background */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                transparent 0%, 
                transparent 45%, 
                rgba(0, 200, 220, 0.15) 45%, 
                rgba(0, 180, 200, 0.25) 100%);
            clip-path: polygon(55% 0, 100% 0, 100% 100%, 35% 100%);
            z-index: 1;
        }

        .card-back::before {
            clip-path: polygon(0 0, 65% 0, 45% 100%, 0 100%);
            background: linear-gradient(135deg, 
                rgba(0, 200, 220, 0.15) 0%, 
                rgba(0, 180, 200, 0.25) 55%, 
                transparent 55%, 
                transparent 100%);
        }

        /* Glow border effect */
        .card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(0, 255, 255, 0.3), 
                transparent, 
                rgba(0, 255, 255, 0.3));
            border-radius: 22px;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.6;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 50px 60px;
        }

        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 40px;
        }

        .card-back .content {
            flex-direction: row-reverse;
        }

        .card-back .welcome-section {
            padding-left: 0;
            padding-right: 40px;
        }

        h2 {
            color: #fff;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 35px;
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 5px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .input-group input:focus {
            border-bottom-color: #00d4ff;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-25px);
            font-size: 12px;
            color: #00d4ff;
        }

        .input-group label {
            position: absolute;
            left: 5px;
            top: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-group i {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(135deg, #00a8c6 0%, #0077b6 100%);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 168, 198, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 168, 198, 0.5);
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .switch-text a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 3px;
        }

        .switch-text a:hover {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            transform: scale(1.05);
        }

        .welcome-text {
            color: #fff;
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            }
            to {
                text-shadow: 0 0 30px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.2);
            }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 850px) {
            .container {
                width: 90%;
                height: auto;
                min-height: 500px;
            }

            .content {
                flex-direction: column !important;
                padding: 30px;
            }

            .welcome-section {
                display: none;
            }

            .form-section {
                width: 100%;
            }
        }

        /* Input validation styles */
        .input-group input:invalid:not(:placeholder-shown) {
            border-bottom-color: #ff4444;
        }

        .input-group input:valid:not(:placeholder-shown) {
            border-bottom-color: #00ff88;
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="card-wrapper" id="cardWrapper">
            <!-- LOGIN (Frente) -->
            <div class="card card-front">
                <div class="content">
                    <div class="form-section">
                        <h2>Login</h2>
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="input-group">
                                <input type="text" id="loginUsername" placeholder=" " required>
                                <label for="loginUsername">Username</label>
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="input-group">
                                <input type="password" id="loginPassword" placeholder=" " required>
                                <label for="loginPassword">Password</label>
                                <i class="fas fa-lock"></i>
                            </div>
                            <button type="submit" class="btn">Login</button>
                        </form>
                        <div class="switch-text">
                            Don't have an account?<br>
                            <a onclick="toggleCard()">Sign Up</a>
                        </div>
                    </div>
                    <div class="welcome-section">
                        <div class="welcome-text">Welcome<br>Back!</div>
                    </div>
                </div>
            </div>

            <!-- REGISTER (Reverso) -->
            <div class="card card-back">
                <div class="content">
                    <div class="form-section">
                        <h2>Register</h2>
                        <form id="registerForm" onsubmit="handleRegister(event)">
                            <div class="input-group">
                                <input type="text" id="regUsername" placeholder=" " required>
                                <label for="regUsername">Username</label>
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="input-group">
                                <input type="email" id="regEmail" placeholder=" " required>
                                <label for="regEmail">Email</label>
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="input-group">
                                <input type="password" id="regPassword" placeholder=" " required minlength="6">
                                <label for="regPassword">Password</label>
                                <i class="fas fa-lock"></i>
                            </div>
                            <button type="submit" class="btn">Register</button>
                        </form>
                        <div class="switch-text">
                            Already have an account?<br>
                            <a onclick="toggleCard()">Sign In</a>
                        </div>
                    </div>
                    <div class="welcome-section">
                        <div class="welcome-text">Welcome!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Crear partículas flotantes
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }
        createParticles();

        // Alternar entre login y registro
        function toggleCard() {
            const wrapper = document.getElementById('cardWrapper');
            wrapper.classList.toggle('register-mode');
        }

        // Manejar login
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            // Aquí conectas con tu backend
            console.log('Login attempt:', { username, password });

            // Ejemplo de integración:
            // fetch('/api/login', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ username, password })
            // })

            alert('Login exitoso! (Conecta con tu backend)');
        }

        // Manejar registro
        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            // Aquí conectas con tu backend
            console.log('Register attempt:', { username, email, password });

            // Ejemplo de integración:
            // fetch('/api/register', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ username, email, password })
            // })

            alert('Registro exitoso! (Conecta con tu backend)');
        }

        // Efecto 3D al mover el mouse (opcional, sutil)
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            container.style.transform = `
                perspective(1200px) 
                rotateY(${x * 5}deg) 
                rotateX(${-y * 5}deg)
            `;
        });

        document.addEventListener('mouseleave', () => {
            const container = document.querySelector('.container');
            container.style.transform = 'perspective(1200px) rotateY(0deg) rotateX(0deg)';
            container.style.transition = 'transform 0.5s ease';
        });

        document.addEventListener('mouseenter', () => {
            const container = document.querySelector('.container');
            container.style.transition = 'transform 0.1s ease';
        });
    </script>
</body>
</html>
